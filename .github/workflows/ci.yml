name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails fast if an item has no artwork — cheaper than finding out in the build.
      - run: npm run verify:images

      - run: npx astro check
      - run: npm test

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
